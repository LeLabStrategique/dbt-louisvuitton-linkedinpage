  - name: mrt_posts_on_going
    description: Mart model that maintains an ongoing, incrementally updated table of post statistics, with UPSERT logic based on post_id and day.
    config:
      schema: _MART
      materialized: incremental
      unique_key: ['post_id', 'day']
      cluster_by: ['day', 'organization_id', 'post_category']
      incremental_strategy: merge
      on_schema_change: fail
    columns:
      - name: day
        description: Date of the snapshot.
        tests:
          - not_null
      - name: post_id
        description: Unique identifier for the LinkedIn post.
        tests:
          - not_null
      - name: organization_id
        description: Identifier for the organization that owns the post.
        tests:
          - not_null
      - name: type
