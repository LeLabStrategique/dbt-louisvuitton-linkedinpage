name: 'linkedin_pages_transform'
version: '1.0.0'
config-version: 2

profile: 'user'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
log-path: "logs"

clean-targets:
  - "target"
  - "dbt_packages"

# ⚙️ Forcer le nom exact des datasets (sans préfixe DBT Cloud)
models:
  linkedin_pages_transform:
    +materialized: incremental
    +schema: "{{ target.name }}"  # défaut

    staging:
      # Dataset = nom du dataset source + "_STAGING"
      +schema: "{{ var('source_dataset', 'linkedin_pages_normalized') }}_STAGING"
      +materialized: incremental
      +tags: ['staging']

    mart:
      # Dataset = nom du dataset source + "_MART"
      +schema: "{{ var('source_dataset', 'linkedin_pages_normalized') }}_MART"
      +materialized: table
      +tags: ['mart']
